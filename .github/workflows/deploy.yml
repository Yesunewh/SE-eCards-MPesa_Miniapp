# Uploads the mini app (index.html, admin.html, web.html, assets/) to
# ecard-miniapp.paperless.et on every push to main. Only changed files are sent.
#
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.paperless.et
#   FTP_USERNAME  the cPanel FTP account, e.g. deploy@ecard-miniapp.paperless.et
#   FTP_PASSWORD  that account's password
# Create the FTP account in cPanel with its directory set to the subdomain's
# document root, so files land at the site root.
name: Deploy to ecard-miniapp.paperless.et

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .github/**
            site/**
            site-builder/**
