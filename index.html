<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dce4fb">
<title>eCards Digital Cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app shell. Screens stack absolutely and slide in like native pushes.
   Light-only on purpose, to match the source app. Currency is set in one place in the script (CUR).
   All words on screen come from the I18N catalog in the script (en, am, om, so, ti). */
:root{
  --blue:#1d55f3;
  --blue-text:#2a62ef;
  --blue-tint:#cddafd;
  --sel:#94c0f8;
  --ink:#151a29;
  --ink-2:#394054;
  --muted:#697086;
  --line:#e8eaf0;
  --bg:#f5f6f9;
  --surface:#ffffff;
  --chip:#f4f5f8;
  --green:#169a49;
  --purple:#b02cd8;
  --font:"Figtree", "Noto Sans Ethiopic", "Kefa", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --sat:env(safe-area-inset-top, 0px);
  --sab:env(safe-area-inset-bottom, 0px);
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:#cfd6e7;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2.5px solid #5b8cff;outline-offset:2px}
h1,h2,h3,h4{text-wrap:balance}

#app{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;background:var(--bg);isolation:isolate}
#app.booting{background:linear-gradient(180deg,#dbe3fb 0%,#e1e8fb 55%,#ecf0fb 100%)}
@media (min-width:560px) and (min-height:720px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(1100px 620px at 50% 0%,#e8edfb,#c7cfe3)}
  #app{height:min(900px, calc(100dvh - 48px));border-radius:46px;box-shadow:0 0 0 11px #0f121a,0 0 0 13px #2c303b,0 40px 90px rgba(20,30,70,.35)}
}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- screens + header ---------- */
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;will-change:transform}
.scroller{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.pad-top{padding-top:calc(var(--sat) + 74px)}
.soft{background:linear-gradient(180deg,#c9dafe 0,#dbe6fd 170px,#edf1f9 520px,#f2f4f8 100%)}
.soft .scroller{background:transparent}

.topbar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(var(--sat) + 12px) var(--gr) 10px var(--gl);transition:background-color .25s, box-shadow .25s}
.topbar.solid{background:rgba(246,247,251,.94);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);box-shadow:0 1px 0 rgba(20,30,60,.07)}
.grow{flex:1}
.circ{position:relative;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 2px 12px rgba(30,40,90,.10)}
.pill{height:46px;padding:0 20px;border-radius:23px;background:rgba(255,255,255,.93);font-weight:600;font-size:17px;color:#2b3142;box-shadow:0 2px 12px rgba(30,40,90,.10);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tb-title{flex:1;min-width:0;font-size:21px;font-weight:600;color:#2b3142;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(4px);transition:opacity .2s, transform .2s}
.solid .tb-title,.static .tb-title{opacity:1;transform:none}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#ff3b30;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;font-variant-numeric:tabular-nums}

/* ---------- gift card package ---------- */
.pkg{position:relative;width:100%;aspect-ratio:300/270;max-width:100%;container-type:inline-size;filter:drop-shadow(0 3.2cqw 4.6cqw rgba(76,86,170,.20))}
.shell{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.gcard{position:absolute;left:1.8%;right:1.8%;top:27.6%;bottom:1.9%;border-radius:5.6cqw;overflow:hidden;
  --rc:rgba(255,255,255,.09);--rs:2.3cqw;
  background:
    repeating-radial-gradient(circle at 88% 125%, transparent 0 calc(var(--rs) - .28cqw), var(--rc) calc(var(--rs) - .28cqw) var(--rs)),
    repeating-radial-gradient(circle at -15% -40%, transparent 0 calc(var(--rs) - .28cqw), var(--rc) calc(var(--rs) - .28cqw) var(--rs)),
    linear-gradient(150deg, var(--c1), var(--c2));
  box-shadow:inset 0 0 0 .35cqw rgba(255,255,255,.08)}
.gcard.light{--rc:rgba(20,24,40,.065)}
.gcard::after{content:"";position:absolute;inset:0;background:linear-gradient(118deg,rgba(255,255,255,.16),rgba(255,255,255,0) 38%);pointer-events:none}
.mark{position:absolute;left:0;right:0;top:0;bottom:22%;display:flex;align-items:center;justify-content:center;gap:2.2cqw;padding:0 5cqw;
  color:var(--mk);font-size:calc(var(--ms) * 8.8cqw);font-weight:var(--fw);letter-spacing:var(--ls);white-space:nowrap;overflow:hidden;line-height:1}
.mark .ic{width:1.18em;height:1.18em;stroke-width:2.3}
.mark .logo{display:block;max-width:64%;max-height:46%;object-fit:contain}
.gcard .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.band{position:absolute;left:0;right:0;bottom:0;height:22%;display:flex;align-items:center;justify-content:space-between;padding:0 4.6cqw;background:var(--band, rgba(0,0,0,.17))}
.val{color:#fff;font-weight:700;font-size:7.4cqw;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.flag{font-size:6.4cqw;line-height:1;background:rgba(255,255,255,.6);border-radius:1.6cqw;padding:.45cqw .7cqw;box-shadow:0 0 0 .35cqw rgba(255,255,255,.35)}

/* ---------- splash ---------- */
.splash{background:linear-gradient(180deg,#dbe3fb 0%,#e1e8fb 55%,#ecf0fb 100%);z-index:40;cursor:default}
.splash .dots,.lg-art .dots{position:absolute;
  background-image:radial-gradient(circle, rgba(85,100,170,.17) 1.5px, transparent 1.9px);background-size:13px 13px;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 25%, transparent 72%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%, #000 25%, transparent 72%)}
.splash .dots{left:4%;right:4%;top:27%;bottom:27%}
.fl{position:absolute;transform:translate(-50%,-50%) perspective(900px) rotateX(16deg) rotate(-26deg);
  animation:pop .7s cubic-bezier(.2,.8,.2,1) both, bob 3.8s ease-in-out infinite alternate;animation-delay:calc(var(--i) * 55ms), var(--d)}
.fl .pkg{filter:drop-shadow(0 4cqw 5cqw rgba(70,80,165,.24))}
@keyframes pop{from{opacity:0;scale:.86}}
@keyframes bob{to{translate:0 -9px}}
.loading{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;padding:0 24px;text-align:center;font-size:22px;font-weight:500;color:#1d2333;animation:breathe 1.6s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:1}to{opacity:.55}}

/* ---------- home ---------- */
.hero{position:relative;width:100%;aspect-ratio:1/1;max-height:64vh;background:#14161d;overflow:hidden}
.slides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.slides::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow:hidden}
.wall{position:absolute;left:-30%;right:-30%;top:-30%;bottom:-30%;display:grid;grid-template-columns:repeat(6,1fr);gap:9px;align-content:center;transform:rotate(-10deg)}
.wall i{position:relative;display:block;aspect-ratio:2/3;border-radius:9px;overflow:hidden}
.wall i::after{content:"";position:absolute;left:12%;right:30%;bottom:10%;height:6%;border-radius:2px;background:rgba(255,255,255,.62)}
.wall i.k1::after{top:9%;bottom:auto;right:14%;height:9%}
.wall i.k2::before{content:"";position:absolute;left:28%;top:26%;width:44%;aspect-ratio:1;border-radius:50%;background:rgba(0,0,0,.22)}
.slide .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shade{position:absolute;inset:0;background:
  radial-gradient(ellipse 72% 52% at 50% 50%, rgba(8,8,14,.62), rgba(8,8,14,.3) 70%, rgba(8,8,14,.18)),
  linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,0) 28%, rgba(0,0,0,0) 78%, rgba(0,0,0,.32))}
.copy{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;color:#fff;padding:24px var(--gr) 0 var(--gl)}
.copy .t1{font-size:clamp(38px,12.5vw,52px);font-weight:800;letter-spacing:-.025em;line-height:1}
.copy .t1::after{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--accent);margin:12px auto 10px}
.copy .t2{font-size:clamp(26px,8.6vw,36px);font-weight:700;line-height:1.15}
.shop{margin-top:22px;background:#fff;color:#111;font-weight:600;font-size:18px;padding:13px 32px;border-radius:999px;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.hdots{position:absolute;left:0;right:0;bottom:46px;display:flex;justify-content:center;gap:7px;pointer-events:none}
.hdots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.55);transition:width .3s, background-color .3s}
.hdots i.on{width:22px;background:#fff}

.sheet{position:relative;z-index:2;margin-top:-30px;background:#f6f6f9;border-radius:30px 30px 0 0;padding:32px 0 calc(var(--sab) + 40px)}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:0 var(--gr) 0 var(--gl)}
.sec-head h2,.sec-title{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.sec-title{padding:36px var(--gr) 0 var(--gl)}
.viewall{display:inline-flex;align-items:center;gap:2px;border:1.6px solid var(--blue);color:var(--blue);font-weight:700;font-size:17px;padding:5px 7px 5px 13px;border-radius:9px;white-space:nowrap}
.viewall .ic{width:20px;height:20px;stroke-width:2.6}

.hrow{display:flex;gap:22px;overflow-x:auto;padding:22px var(--gr) 6px var(--gl);scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding-left:16px}
.hrow::-webkit-scrollbar,.prow::-webkit-scrollbar{display:none}
.btile{flex:none;width:90px;display:flex;flex-direction:column;align-items:center;gap:16px;scroll-snap-align:start}
.tile{width:90px;height:90px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;box-shadow:0 8px 18px rgba(30,40,80,.07);text-align:center;line-height:1.05}
.tile .ic{width:26px;height:26px;stroke-width:2.2}
.tname{font-size:12.5px;max-width:100%}
.tile .logo{display:block;max-width:74%;max-height:54%;object-fit:contain}
.tlabel{font-weight:700;font-size:17px;color:var(--blue-text);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.sbar{position:relative;width:44px;height:4px;border-radius:3px;background:#d9dbe3;margin:20px auto 0;overflow:hidden}
.sbar i{position:absolute;top:0;bottom:0;left:0;width:20px;border-radius:3px;background:#3a4054}

.prow{display:flex;gap:14px;overflow-x:auto;padding:18px var(--gr) 8px var(--gl);scroll-snap-type:x proximity;scrollbar-width:none;scroll-padding-left:16px}
.pitem{flex:none;width:158px;display:flex;flex-direction:column;background:#fff;border-radius:20px;padding:10px 10px 14px;box-shadow:0 6px 16px rgba(30,40,80,.05);scroll-snap-align:start}
.pitem .pkg{filter:drop-shadow(0 2.4cqw 3cqw rgba(76,86,170,.14))}
.pitem .nm{font-size:13.5px;color:var(--ink-2);margin:10px 2px 4px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pitem .pr{font-size:16px;font-weight:700;margin:0 2px;font-variant-numeric:tabular-nums}

/* ---------- product ---------- */
.product .scroller{background:linear-gradient(180deg,#dbe4fc 0,#e5eaf9 430px,#eef0f6 780px)}
.p-hero{position:relative;display:flex;justify-content:center;padding:calc(var(--sat) + 76px) 0 34px}
.p-hero::before{content:"";position:absolute;left:12%;right:12%;top:30%;bottom:6%;background:radial-gradient(ellipse at center, rgba(105,115,220,.38), transparent 70%);filter:blur(22px)}
.p-pkg{position:relative;width:80%;max-width:360px}
.p-pkg .pkg{filter:drop-shadow(0 4cqw 7cqw rgba(76,86,170,.25))}
.p-body{display:flex;flex-direction:column;gap:14px;padding:0 var(--gr) calc(var(--sab) + 120px) var(--gl)}
.info{border-radius:26px;background:var(--blue-tint);overflow:hidden}
.info-head{display:flex;align-items:center;gap:9px;padding:13px 18px;color:#1d55e6;font-weight:700;font-size:19px}
.info-head svg{width:26px;height:26px;flex:none}
.info-card{background:#fff;border-radius:26px;padding:18px 16px 20px}
.p-title{margin:0 0 6px;font-size:20px;font-weight:500;color:#1a1f2e;line-height:1.3}
.p-price{font-size:32px;font-weight:700;letter-spacing:-.01em;margin-bottom:2px;font-variant-numeric:tabular-nums}
.p-rate{font-size:14px;color:var(--muted);margin-bottom:14px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:12px;background:var(--chip);color:#3a4152;font-weight:600;font-size:14.5px;white-space:nowrap}
.chip .ic{width:18px;height:18px}
.chip.instant{background:linear-gradient(90deg,#f6e2fc,#fcf6fe);color:var(--purple)}
.chip.instant svg{width:19px;height:19px}
.box{background:#fff;border-radius:24px;padding:18px 16px}
.box h3{margin:2px 2px 16px;font-size:20px;font-weight:700}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{height:56px;border-radius:14px;border:1.6px solid #e8eaf0;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:500;color:#1f2433;font-variant-numeric:tabular-nums;transition:border-color .15s, box-shadow .15s}
.opt.on{border:2px solid var(--sel);font-weight:700;box-shadow:0 0 0 3px rgba(148,192,248,.2)}
.opts.single{display:flex}
.opts.single .opt{padding:0 26px}
.opt .fl-e{font-size:18px;line-height:1}
.amt-wrap{position:relative}
.amts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:3px;margin:-3px}
.amts .opt{height:64px}
.opt-usd{font-size:19px;font-weight:700}
.opt-br{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1}
.opt.oos .opt-br{display:none}
.amts::-webkit-scrollbar{display:none}
.amts .opt{scroll-snap-align:start}
.amt-next{position:absolute;right:-4px;top:0;height:62px;width:52px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff 58%);color:var(--ink)}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.feat{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:18px 6px 16px;border:1.6px solid #eceef3;border-radius:16px;font-weight:600;font-size:15px;line-height:1.3;color:#1f2433;min-width:0;overflow-wrap:anywhere}
.feat .ic{width:30px;height:30px;color:#2a6df4}
.acc{background:#f7f8fa;border-radius:16px;margin-top:10px}
.acc summary{list-style:none;display:flex;align-items:center;gap:12px;padding:18px 16px;font-weight:600;font-size:17px;cursor:pointer;border-radius:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary span{flex:1}
.acc .chev{transition:transform .2s}
.acc[open] .chev{transform:rotate(180deg)}
.acc-body{padding:0 18px 16px 50px;color:var(--ink-2);font-size:15px;line-height:1.6}
.acc-body ol,.acc-body ul{margin:0;padding-left:18px}
.acc-body li+li{margin-top:6px}
.acc-body p{margin:0}

.buybar{position:absolute;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border-top:1px solid #e9ebf1;
  padding:14px var(--gr) calc(var(--sab) + 18px) var(--gl)}
.bb-price{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bb-vat{font-size:15px;color:#596074;margin-top:2px}
.btn{min-height:56px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;font-size:18px;padding:8px 18px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.2;text-wrap:balance}
.btn.ghost{background:#eef2fd;color:var(--blue)}
.btn:disabled{background:#d5d9e4;color:#5d6478;cursor:not-allowed}
.buybar .btn{flex:0 0 48%;min-height:58px}

/* ---------- sheets + toast ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:rgba(12,16,30,.42);opacity:0;transition:opacity .25s}
.bsheet{position:relative;background:#fff;border-radius:26px 26px 0 0;padding:10px var(--gr) calc(var(--sab) + 22px) var(--gl);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:90%;overflow:auto}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .bsheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:#dfe1e7;margin:0 auto 16px}
.sheet-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.added-row{display:flex;gap:14px;align-items:center}
.added-thumb{width:112px;flex:none}
.added-ok{display:flex;align-items:center;gap:6px;color:var(--green);font-weight:700;font-size:15px;margin-bottom:6px}
.added-ok .ic{width:18px;height:18px;stroke-width:2.8}
.added-name{font-size:16px;font-weight:500;line-height:1.3}
.added-price{font-size:19px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.pay h3{margin:4px 0 2px;font-size:20px;font-weight:700;text-align:center}
.pay-amt{font-size:36px;font-weight:800;text-align:center;margin:4px 0 16px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rows{background:var(--chip);border-radius:16px;padding:2px 14px;margin:0}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e6e8ef;font-size:15px}
.rows div:last-child{border-bottom:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:13.5px;color:var(--muted);line-height:1.55;margin:12px 2px 0}
.note.c{text-align:center;font-size:15px;margin-top:6px}
.pay .st,.consent .st{display:none}
.pay[data-state="confirm"] .st-confirm,.pay[data-state="wait"] .st-wait,.pay[data-state="done"] .st-done,
.consent[data-state="ask"] .st-ask,.consent[data-state="wait"] .st-wait{display:block}
.st-wait,.st-done{padding:6px 0 10px;text-align:center}
.spin{width:56px;height:56px;border-radius:50%;border:4px solid #e3e8fb;border-top-color:var(--blue);animation:spin .9s linear infinite;margin:14px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.done-ic{width:74px;height:74px;border-radius:50%;background:#e2f5e9;color:var(--green);display:grid;place-items:center;margin:8px auto 14px;animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.done-ic .ic{width:38px;height:38px;stroke-width:3}

/* ---------- login ---------- */
.login{background:linear-gradient(180deg,#dbe3fb 0%,#e3e9fb 52%,#f3f5fb 100%)}
.lg-art{position:relative;flex:1;min-height:200px;overflow:hidden}
.lg-art .dots{inset:8% 6%}

/* ---------- M-Pesa consent ---------- */
.cs-head{display:flex;align-items:flex-start;justify-content:center;gap:14px;margin:2px 0 14px}

.cs-list .ic{color:var(--green);width:20px;height:20px;stroke-width:2.6}

/* ---------- language picker ---------- */

.ls-list{display:flex;flex-direction:column;gap:8px}

/* ---------- account footer on home ---------- */
.acct{margin:40px var(--gr) 0 var(--gl);width:calc(100% - var(--gl) - var(--gr));display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border-radius:22px;padding:14px 14px 14px 16px;box-shadow:0 6px 16px rgba(30,40,80,.05)}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* support */
.sup-body{padding:6px var(--gr) calc(var(--sab) + 30px) var(--gl);display:flex;flex-direction:column;gap:12px}
.sup-hero{background:#fff;border-radius:22px;padding:20px 18px;text-align:center;box-shadow:0 6px 16px rgba(30,40,80,.05);display:flex;flex-direction:column;align-items:center;gap:6px}

.sup-hero h2{margin:0;font-size:21px;font-weight:700}
.sup-hero p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.sup-ch{color:inherit;text-decoration:none}
.sup-ch .val{max-width:56%}
.sup-new{width:100%}
.tk-row .set-ic{position:relative}
.tk-dot{position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.tk-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;max-width:42%}
.tk-meta small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tk-st{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tk-st.open{background:#fff1d6;color:#8a5a00}
.tk-st.answered{background:#e2f5e9;color:var(--green)}
.tk-st.closed{background:#e9edf3;color:var(--ink-2)}
.tk-form{display:flex;flex-direction:column}
.tk-lbl{margin:16px 2px 8px;font-size:14.5px;font-weight:700;color:var(--ink-2)}
.tk-form .tk-lbl:first-child{margin-top:0}
.tk-topics{display:flex;flex-wrap:wrap;gap:8px}
.tk-topics button{padding:9px 14px;border-radius:999px;background:#fff;border:1.4px solid #e2e5ee;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.tk-topics button[aria-checked="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.tk-select{position:relative}
.tk-select select{width:100%;appearance:none;-webkit-appearance:none;background:#f2f4f8;border:1.6px solid transparent;border-radius:14px;padding:13px 40px 13px 14px;font:inherit;font-size:15.5px;color:var(--ink)}
.tk-select select:focus{border-color:var(--sel);background:#fff;outline:0}
.tk-select .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted)}
.tk-ta{width:100%;min-height:110px;border-radius:16px;background:#f2f4f8;border:1.6px solid transparent;padding:12px 14px;font:inherit;font-size:16px;line-height:1.45;color:var(--ink);resize:vertical;outline:0}
.tk-ta:focus{border-color:var(--sel);background:#fff}
.tk-ta.err{border-color:#e5484d;background:#fff}
.tk-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tk-head .ls-title{margin:0}
.tk-msgs{display:flex;flex-direction:column;gap:10px;margin:16px 0 14px}
.tk-msg{max-width:86%;border-radius:18px;padding:10px 14px}
.tk-msg b{display:block;font-size:12.5px;margin-bottom:2px;opacity:.75}
.tk-msg p{margin:0;font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.tk-msg small{display:block;margin-top:4px;font-size:12px;opacity:.65}
.tk-msg.me{align-self:flex-end;background:#e6eeff;color:#14244d;border-bottom-right-radius:6px}
.tk-msg.sup{align-self:flex-start;background:#f2f4f8;border-bottom-left-radius:6px}
.tk-reply{display:flex;flex-direction:column;gap:10px}
.tk-reply .tk-ta{min-height:72px}
.acct-set{position:relative}
.acct-set.dot::after{content:"";position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.rdot{width:10px;height:10px;border-radius:50%;background:#ff3b30;flex:none}
/* settings screen */
.set-body{padding:6px var(--gr) calc(var(--sab) + 30px) var(--gl);display:flex;flex-direction:column;gap:10px}
.set-acct{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 16px rgba(30,40,80,.05)}

.set-acct .acct-txt b{font-size:18px}
.set-h{margin:12px 6px -2px;font-size:13.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.set-h:not(:lang(am)):not(:lang(ti)){letter-spacing:.07em}
.set-list{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 16px rgba(30,40,80,.05)}
.set-row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 14px 10px 16px;text-align:left}
.set-row+.set-row{border-top:1px solid var(--line)}

.set-row .lbl{flex:1;min-width:0;font-weight:600;font-size:16.5px;line-height:1.3}
.set-row .val{flex:0 1 auto;min-width:0;max-width:48%;color:var(--muted);font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row .chev{width:20px;height:20px;color:#a3a9b8}
.set-row .lbl .sub{display:block;margin-top:2px;font-size:14px;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.set-row.danger .set-ic{background:#fdeaea;color:#d93a3f}
.set-row.muted .set-ic{background:var(--chip);color:var(--ink-2)}
.acct-user{display:flex;align-items:center;gap:12px}
.acct-txt{display:flex;flex-direction:column;min-width:0}
.acct-txt b{font-size:16.5px}
.acct-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.acct-b{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:11px;padding:9px 12px;font-weight:600;font-size:14.5px;color:var(--ink-2)}
.acct-b .ic{width:17px;height:17px;color:var(--blue)}

/* ---------- welcome pop-up ---------- */
.sheet-wrap.modal{justify-content:center;align-items:stretch;padding:calc(var(--sat) + 18px) var(--gr) calc(var(--sab) + 18px) var(--gl)}
.sheet-wrap.modal .bsheet{border-radius:28px;padding:14px 18px 20px;max-height:100%;margin:auto 0;opacity:0;transform:translateY(18px) scale(.96);transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s}
.sheet-wrap.modal.open .bsheet{opacity:1;transform:none}
.wl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}

.wl-langs button[aria-pressed="true"]{background:var(--blue);color:#fff}
.wl-x{width:38px;height:38px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--ink-2);flex:none}
.wl-x .ic{width:18px;height:18px}
.wl .ec-badge{width:64px;height:64px;border-radius:19px;margin:14px auto 14px}
.wl .ec-word{font-size:15px}
.wl-title{text-align:center;font-size:23px;font-weight:800;margin:0 0 8px;line-height:1.3;letter-spacing:-.01em}
.wl-intro{text-align:center;color:var(--ink-2);font-size:15.5px;line-height:1.55;margin:0 auto 18px;max-width:34ch}
.wl-how{font-size:17px;font-weight:700;margin:0 0 12px}
.wl-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.wl-steps li{display:flex;gap:12px;align-items:flex-start}
.wl-steps .n{width:30px;height:30px;border-radius:50%;background:#e6edfe;color:var(--blue);font-weight:800;font-size:15px;display:grid;place-items:center;flex:none}
.wl-steps b{display:block;font-size:16px;margin:4px 0 2px}
.wl-steps .d{display:block;color:var(--ink-2);font-size:14.5px;line-height:1.5}
.wl-note{display:flex;gap:9px;align-items:flex-start;background:#fff6df;color:#5f4500;border-radius:14px;padding:11px 12px;font-size:13.5px;line-height:1.5;margin:18px 0 0}
.wl-note .ic{width:18px;height:18px;margin-top:1px}
.wl-cta{width:100%;margin-top:16px}
.wl:is([lang="am"],[lang="ti"]) .wl-title{font-size:21px}

.toast{position:absolute;left:50%;bottom:calc(var(--sab) + 112px);z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:rgba(20,24,36,.93);color:#fff;font-size:15px;font-weight:500;padding:11px 18px;border-radius:14px;max-width:calc(100% - 32px);width:max-content;text-align:center;transition:opacity .22s, transform .22s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- orders ---------- */
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 32px;pointer-events:none}
.empty h2{margin:0 0 10px;font-size:24px;font-weight:700}
.empty p{margin:0;color:var(--muted);font-size:17px;line-height:1.5}
.o-body,.c-body{display:flex;flex-direction:column;gap:14px;padding:6px var(--gr) calc(var(--sab) + 30px) var(--gl)}
.order{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 16px rgba(30,40,80,.05)}
.o-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.o-id{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.o-date{color:var(--muted);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.o-status{display:inline-flex;align-items:center;gap:5px;background:#e2f5e9;color:var(--green);font-weight:700;font-size:13px;padding:6px 10px;border-radius:999px;white-space:nowrap}

.o-codes{margin-top:8px}
.code{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--chip);border-radius:12px;padding:8px 8px 8px 12px;margin-top:6px}
.code-v{font-family:ui-monospace, "SF Mono", Menlo, Consolas, monospace;font-size:14px;letter-spacing:.04em;color:var(--ink-2);user-select:all;-webkit-user-select:all;min-width:0;overflow-wrap:anywhere}

.code-b{display:inline-flex;align-items:center;gap:5px;flex:none;background:#fff;color:var(--blue);font-weight:700;font-size:13.5px;padding:7px 11px;border-radius:10px;box-shadow:0 1px 3px rgba(20,30,60,.08)}

.o-total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;font-size:15px;color:var(--muted)}

  background:radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),linear-gradient(165deg,#cfdcfb 0%,#aec5f7 55%,#93aef0 100%);

  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.16));-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid rgba(255,255,255,.6);transition:color .3s}

.w-act-ic{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--blue);box-shadow:0 6px 16px rgba(30,40,90,.08)}

.w-list{display:flex;flex-direction:column;gap:10px}

/* ================= navigation ================= */
const stack = [];   // { name, params, el }
let useHist = true, histDepth = 0, backTimer = null;
const EASE = 'cubic-bezier(.22,.8,.24,1)';

function push(name, params = {}) {
  const prev = stack[stack.length - 1];
  const el = SCREENS[name](params);
  app.appendChild(el);
  stack.push({ name, params, el });
  updateCartBadges();
  if (prev) prev.el.setAttribute('inert', '');
  let prevAnim = null;
  const finish = () => {
    stack.forEach((s, i) => { s.el.style.visibility = i === stack.length - 1 ? '' : 'hidden'; });
    if (prevAnim) prevAnim.cancel();
  };
  if (reduce || !el.animate) finish();
  else {
    const a = el.animate([{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }], { duration: 330, easing: EASE });
    if (prev) prevAnim = prev.el.animate([{ transform: 'none' }, { transform: 'translateX(-22%)' }], { duration: 330, easing: EASE, fill: 'forwards' });
    a.onfinish = finish;
  }
  if (useHist) { try { history.pushState({ ecard: stack.length }, ''); histDepth++; } catch (e) { useHist = false; } }
}
function popScreen() {
  if (stack.length <= 1) return;
  closeSheet(true);
  const top = stack.pop(), prev = stack[stack.length - 1];
  prev.el.style.visibility = ''; prev.el.removeAttribute('inert');
  updateCartBadges();
  if (reduce || !top.el.animate) { top.el.remove(); return; }
  top.el.style.pointerEvents = 'none';
  prev.el.animate([{ transform: 'translateX(-22%)' }, { transform: 'none' }], { duration: 280, easing: EASE });
  const a = top.el.animate([{ transform: 'none' }, { transform: 'translateX(100%)' }], { duration: 280, easing: 'cubic-bezier(.4,0,.6,1)', fill: 'forwards' });
  a.onfinish = () => top.el.remove();
}
function goBack() {
  if (stack.length <= 1) return;
  if (useHist && histDepth > 0) {
    const n = stack.length;
    history.back();
    clearTimeout(backTimer);
    backTimer = setTimeout(() => { if (stack.length === n) { useHist = false; popScreen(); } }, 450);
  } else popScreen();
}
window.addEventListener('popstate', () => {
  if (!useHist) return;
  clearTimeout(backTimer);
  histDepth = Math.max(0, histDepth - 1);
  if (stack.length > 1) popScreen();
});
function resetHome() {
  closeSheet(true);
  while (stack.length > 1) stack.pop().el.remove();
  const home = stack[0].el;
  home.style.visibility = ''; home.removeAttribute('inert');
  home.getAnimations && home.getAnimations().forEach(a => a.cancel());
  updateCartBadges();
}

/* Forms work everywhere: some preview windows block real form submission, so Save/Send buttons and the
   Enter key raise the submit event themselves (nothing is ever sent anywhere; the handlers stay the same). */
(() => {
  const fire = f => {
    if (!f.noValidate && !f.checkValidity()) { f.reportValidity(); return; }
    f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
  };
  const NO_ENTER = /^(checkbox|radio|file|button|submit|reset|color|range|image)$/;
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button, input[type="submit"]');
    if (!b || b.disabled || !b.form || (b.type || '').toLowerCase() !== 'submit') return;
    e.preventDefault(); fire(b.form);
  }, true);
  document.addEventListener('keydown', e => {
    const el = e.target;
    if (e.key !== 'Enter' || e.isComposing || e.defaultPrevented || el.tagName !== 'INPUT' || !el.form || NO_ENTER.test(el.type)) return;
    if (!el.form.querySelector('button[type="submit"]:not([disabled]), input[type="submit"]:not([disabled])')) return;
    e.preventDefault(); fire(el.form);
  });
})();

  if (!el) { el = h('<div class="toast" role="status" aria-live="polite"></div>'); app.appendChild(el); }
  el.textContent = '';

  el.classList.toggle('act', !!action);

    b.addEventListener('click', ev => { ev.stopPropagation(); el.classList.remove('show'); action.fn(); });

}

  }
  function commitRecv() { const v = checkRecv(rst); if (v == null) return false; saveRecv(rst.by, v); editing = false; return true; }
  wireRecv(recvSlot, rst, f => renderRecv(f));
  recvSlot.addEventListener('submit', e => { e.preventDefault(); const ok = commitRecv(); renderRecv(!ok); });

  });

  function render() {
    if (!cart.length) {
      body.innerHTML = `<div class="c-empty"><h2>${esc(t('cartEmptyT'))}</h2><p>${esc(t('cartEmptyP'))}</p><button class="btn" data-act="home">${esc(t('browse'))}</button></div>`;
      bar.hidden = recvSlot.hidden = sumSlot.hidden = true; return;
    }
    bar.hidden = recvSlot.hidden = sumSlot.hidden = false;
    const total = cartTotal();
    body.innerHTML = cart.map((it, i) => {
      const b = BR[it.bid];
      return `<article class="c-item">
        <button class="c-thumb" data-open="${it.bid}|${it.amount}|${it.region}" aria-label="${esc(b.name)}">${pkg(it.bid, it.amount, it.region, true, isOut(it.bid, it.amount))}</button>
        <div class="c-info">

          ${isOut(it.bid, it.amount) ? `<div class="c-pre">${ic('hourglass')}<span>${esc(t('preorderTag', { date: dmy(etaOf(it.bid, it.amount)) }))}</span></div>` : ''}
          ${!isOut(it.bid, it.amount) && it.qty > stockOf(it.bid, it.amount) ? `<div class="c-pre">${ic('clock')}<span>${esc(t('onlyLeft', { n: stockOf(it.bid, it.amount) }))}</span></div>` : ''}
          <div class="c-price">${fmt(priceOf(it.amount) * it.qty)}</div>
          <div class="c-ctrl">
            <div class="stepper"><button data-dec="${i}" aria-label="${esc(t('decrease'))}">${ic('minus')}</button><span>${it.qty}</span><button data-inc="${i}" aria-label="${esc(t('increase'))}">${ic('plus')}</button></div>
            <button class="c-del" data-del="${i}" aria-label="${esc(t('remove'))}">${ic('trash')}</button>

      <div><span>${esc(t('vatIncl', { vat: vatPct() }))}</span><span>${fmt(total * VAT / (1 + VAT))}</span></div>
      <div class="tot"><span>${esc(t('total'))}</span><span>${fmt(total)}</span></div>
    </div>`;
    el.querySelector('.bb-price').textContent = fmt(total);
  }
  body.addEventListener('click', e => {
    const b = e.target.closest('[data-inc],[data-dec],[data-del]'); if (!b) return;
    const i = +(b.dataset.inc ?? b.dataset.dec ?? b.dataset.del);
    if (!cart[i]) return;
    if (b.dataset.inc != null) { const cap = capOf(cart[i]); if (cart[i].qty >= cap) { toast(t('onlyLeft', { n: cap })); return; } cart[i].qty++; }
    else if (b.dataset.dec != null) { if (cart[i].qty > 1) cart[i].qty--; else cart.splice(i, 1); }
    else cart.splice(i, 1);
    saveCart();
  });
  el.querySelector('.pay-btn').addEventListener('click', () => {
    if (editing) {   // a typed but unsaved address or number is accepted if it is valid
      const ok = commitRecv();
      renderRecv(!ok);
      if (!ok) { recvSlot.scrollIntoView({ block: 'center', behavior: reduce ? 'auto' : 'smooth' }); return; }
    }
    openPay();
  });
  solidOnScroll(el, 8);
  sub(el, render); render(); renderRecv();
  return el;
}

  let m = String(hex).replace('#', ''); if (m.length === 3) m = m.split('').map(x => x + x).join('');
  const n = parseInt(m, 16); return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255 > 0.5;
};

  const d = new Date(ts), now = new Date();

  const diff = Math.round((day(now) - day(d)) / 86400000);
  const hm = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    const keep = new Set(list.map(x => x.id));

    list.forEach((x, pos) => {
      let c = cardEls.get(x.id);
      if (!c) {
        c = x.id === '__more'
          ? h(`<button class="wcard more" data-more aria-label="${esc(t('chooseCard'))}"></button>`)
          : h(`<button class="wcard${isLight(wcol(x.b)[0]) ? ' lt' : ''}" data-gid="${x.id}" style="${wStyle(x.b)}"></button>`);
        cardEls.set(x.id, c);
        if (anim && !reduce) { c.style.transition = 'none'; c.style.transform = `translateY(${n * TAB + 40}px)`; stackEl.appendChild(c); c.getBoundingClientRect(); c.style.transition = ''; }
        else stackEl.appendChild(c);
      }
      c.innerHTML = x.id === '__more' ? moreInner(hidden) : cardInner(x);
      if (x.id !== '__more') c.setAttribute('aria-label', `${x.b.name}, ${x.items.length} × ${usd(groupTotal(x))}`);
      const depth = n - 1 - pos;
      c.style.zIndex = String(pos + 1);
      c.style.transform = `translateY(${pos * TAB}px) scale(${(1 - depth * 0.045).toFixed(3)})`;
      c.classList.toggle('front', depth === 0);
      c.setAttribute('aria-pressed', String(depth === 0));
    });
    const pk = body.querySelector('.w-pocket');
    pk.style.setProperty('--pk', wcol(g.b)[2]);
    pk.querySelector('.wp-code').textContent = reveal ? w.code : MASK;
    pk.querySelector('.wp-meta').textContent = `${usd(w.it.amount)} · ${fmt(unitOf(w.it))} · ${shortDate(w.o.at)}`;
    const pager = pk.querySelector('.wp-pager');
    pager.hidden = g.items.length < 2;
    pk.querySelector('.wp-pos').textContent = `${i + 1}/${g.items.length}`;
    pk.querySelector('[data-prev]').disabled = i === 0;
    pk.querySelector('[data-next]').disabled = i === g.items.length - 1;
    body.querySelector('[data-wshow] .w-act-ic').innerHTML = ic(reveal ? 'eyeOff' : 'eye');
    body.querySelector('.w-act-l').textContent = reveal ? t('hideCode') : t('showCode');
    const m = body.querySelector('.w-mail');
    m.innerHTML = sentTo(w.o);
    m.hidden = !m.innerHTML;
    body.querySelectorAll('.w-row').forEach(r => { const on = r.dataset.pkey === w.key; r.classList.toggle('on', on); r.setAttribute('aria-current', on ? 'true' : 'false'); });
  }
  function selectGroup(gid) { if (gid === selGid) return; selGid = gid; reveal = false; layout(true); }
  function step(d) {
    const { g, i } = state(); if (!g) return;
    const ni = Math.max(0, Math.min(g.items.length - 1, i + d)); if (ni === i) return;
    idx[g.id] = ni; reveal = false; layout(false);
    const code = body.querySelector('.wp-code');
    if (!reduce && code.animate) code.animate([{ opacity: 0, transform: `translateX(${d * 16}px)` }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'ease-out' });
  }
  function selectItem(key) {
    for (const g of walletGroups()) {
      const k = g.items.findIndex(x => x.key === key);
      if (k >= 0) { idx[g.id] = k; if (selGid !== g.id) selectGroup(g.id); else { reveal = false; layout(false); } return true; }
    }
    return false;
  }
  function openPicker() {
    const { groups, g } = state();
    const s = openSheet(`<div class="grab"></div><h3 class="ls-title">${esc(t('chooseCard'))}</h3>
      <div class="pk-list">${groups.map(x => `<button class="pk-row" data-pick="${x.id}" aria-pressed="${x === g}">
        <span class="w-ic" style="${wStyle(x.b)}">${wMark(x.b)}</span>
        <span class="w-txt"><b>${esc(bname(x.b))}</b><small>×${x.items.length} · ${usd(groupTotal(x))}</small></span>
        ${x === g ? ic('check') : ''}</button>`).join('')}</div>`, { label: t('chooseCard') });
    s.addEventListener('click', e => { const r = e.target.closest('[data-pick]'); if (r) { closeSheet(); selectGroup(r.dataset.pick); } });
  }

  body.addEventListener('click', e => {
    if (e.target.closest('[data-sample]')) { addSampleOrders(); return; }
    if (e.target.closest('[data-history]')) { push('history'); return; }
    if (e.target.closest('[data-restock]')) { restockDemo(); return; }
    if (e.target.closest('[data-more]')) { openPicker(); return; }
    if (e.target.closest('[data-prev]')) { step(-1); return; }
    if (e.target.closest('[data-next]')) { step(1); return; }
    const card = e.target.closest('.wcard[data-gid]');
    if (card) { if (card.dataset.gid === selGid) { reveal = !reveal; layout(false); } else selectGroup(card.dataset.gid); return; }
    const row = e.target.closest('.w-row');
    if (row) {
      if (usedSet.has(row.dataset.pkey)) openCodeSheet(row.dataset.pkey);
      else if (selectItem(row.dataset.pkey)) scroller.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
      return;
    }
    const { w } = state(); if (!w) return;
    if (e.target.closest('[data-wshow]')) { reveal = !reveal; layout(false); }
    else if (e.target.closest('[data-wcopy]')) copyCode(w.code, body.querySelector('.wp-code'));
    else if (e.target.closest('[data-wused]')) markUsedWithUndo(w);
    else if (e.target.closest('[data-wbuy]')) push('product', { bid: w.b.id, val: w.it.amount, reg: w.it.region });
  });
  solidOnScroll(el, 8);
  sub(el, render); render();
  return el;
}

/* full purchase history, grouped by month, filtered by status */
function History() {
  const el = h(`<div class="screen history soft">
    <header class="topbar static"><button class="circ" data-act="back" aria-label="${esc(t('back'))}">${ic('chevL')}</button><div class="tb-title">${esc(t('history'))}</div></header>
    <div class="scroller pad-top"><div class="h-body"></div></div>
  </div>`);
  const body = el.querySelector('.h-body');
  let filter = 'all';
  const lineRow = l => `<div class="w-row">
      <span class="w-ic" style="${wStyle(l.b)}">${wMark(l.b)}</span>
      <span class="w-txt"><b>${esc(bname(l.b))}${l.it.qty > 1 ? ` ×${l.it.qty}` : ''}</b><small><span class="w-tag wait">${esc(t('waitingTag'))}</span>${esc(relDate(l.o.at))}</small></span>
      <span class="w-amt"><b>−&nbsp;${fmt(unitOf(l.it) * l.it.qty)}</b><small>#${esc(l.o.id)}</small></span>
    </div>`;   // a paid pre-order: nothing to do but wait for stock
  function render() {
    const codes = walletItems(), lines = orderLines(['waiting']);
    const isUsed = w => usedSet.has(w.key);
    const entries = [...codes.map(w => ({ kind: 'code', w, at: w.o.at })), ...lines.map(l => ({ kind: l.it.status, l, at: l.o.at }))].sort((x, y) => y.at - x.at);
    const counts = { all: entries.length, wallet: codes.filter(w => !isUsed(w)).length, used: codes.filter(isUsed).length, waiting: lines.filter(l => l.it.status === 'waiting').length };
    const keep = e => filter === 'all' || (filter === 'waiting' ? e.kind === 'waiting' : e.kind === 'code' && (filter === 'used') === isUsed(e.w));
    const list = entries.filter(keep);
    const chips = [['all', t('all')], ['wallet', t('inWallet')], ['used', t('usedTag')]];
    if (counts.waiting || filter === 'waiting') chips.push(['waiting', t('waitingTag')]);
    let html = `<div class="h-filter" role="group">${chips.map(([k, l]) => `<button data-f="${k}" aria-pressed="${filter === k}">${esc(l)} · ${counts[k]}</button>`).join('')}</div>`;
    if (!list.length) html += `<p class="s-none">${esc(t('emptyFilter'))}</p>`;
    else {
      const months = t('months'); let cur = '', out = '';
      list.forEach(e => {
        const d = new Date(e.at), m = `${months[d.getMonth()]} ${d.getFullYear()}`;
        if (m !== cur) { out += `${cur ? '</div>' : ''}<h4 class="h-month">${esc(m)}</h4><div class="h-list">`; cur = m; }
        out += e.kind === 'code' ? purchaseRow(e.w) : lineRow(e.l);
      });
      html += out + '</div>';
    }
    body.innerHTML = html;
  }
  body.addEventListener('click', e => {
    const f = e.target.closest('[data-f]'); if (f) { filter = f.dataset.f; render(); return; }
    const row = e.target.closest('[data-pkey]'); if (row) openCodeSheet(row.dataset.pkey);
  });
  solidOnScroll(el, 8);
  sub(el, render); render();
  return el;
}

    const text = ta.value.trim();
    if (text.length < 10) { ta.classList.add('err'); ta.setAttribute('aria-invalid', 'true'); note.classList.add('err'); note.setAttribute('role', 'alert'); note.textContent = t('msgShort'); ta.focus(); return; }
    const sel = w.querySelector('#tk-order'), now = Date.now(), u = session || DEMO_USER;
    const tk = { id: 'T' + String(Math.floor(100000 + Math.random() * 899999)), at: now, name: u.name, phone: u.phone, email: (session && session.email) || '', topic, orderId: sel && sel.value ? sel.value : null, status: 'open', custSeen: now, msgs: [{ from: 'customer', text, at: now }] };
    mutateTickets(list => list.unshift(tk));
    closeSheet(); emit(); toast(t('msgSent'));
  });
}
function openTicketSheet(id) {
  const x = myTickets().find(y => y.id === id); if (!x) return;
  mutateTickets(list => { const y = list.find(z => z.id === id); if (y) y.custSeen = Date.now(); });
  emit();
  const w = openSheet(`<div class="grab"></div>
    <div class="tk-head"><h3 class="ls-title">${esc(t(TOPIC_KEY[x.topic] || 'topicOther'))}</h3><span class="tk-st ${esc(x.status)}">${esc(t(TK_ST[x.status] || 'tkWaiting'))}</span></div>
    ${x.orderId ? `<p class="note" style="margin:0 2px">${esc(t('orderRef', { id: '#' + x.orderId }))}</p>` : ''}
    <div class="tk-msgs">${x.msgs.map(m => `<div class="tk-msg ${m.from === 'support' ? 'sup' : 'me'}"><b>${esc(m.from === 'support' ? t('supportTeam') : t('you'))}</b><p>${esc(m.text)}</p><small>${esc(relDate(m.at))}</small></div>`).join('')}</div>
    ${x.status === 'closed' ? `<p class="note c">${esc(t('closedNote'))}</p>`
      : `<form class="tk-reply" novalidate><textarea class="tk-ta" rows="2" maxlength="1000" placeholder="${esc(t('writeReply'))}" aria-label="${esc(t('writeReply'))}"></textarea><button class="btn" type="submit">${esc(t('send'))}</button></form>`}`, { label: t('support') });
  const f = w.querySelector('.tk-reply');
  if (f) f.addEventListener('submit', e => {
    e.preventDefault();
    const ta = f.querySelector('textarea'), text = ta.value.trim();
    if (text.length < 2) { ta.classList.add('err'); ta.focus(); return; }
    mutateTickets(list => { const y = list.find(z => z.id === id); if (!y) return; const now = Date.now(); y.msgs.push({ from: 'customer', text, at: now }); y.status = 'open'; y.custSeen = now; });
    closeSheet(); emit(); toast(t('msgSent'));
  });
  const m = w.querySelector('.tk-msgs'); if (m && m.lastElementChild) m.lastElementChild.scrollIntoView({ block: 'nearest' });
}
const SCREENS = { home: Home, product: Product, orders: Orders, history: History, wishlist: Wishlist, cart: Cart, search: Search, brands: Brands, settings: Settings, support: Support };

/* ================= language switch ================= */
function applyLang(code) {
  if (!I18N[code] || code === lang) return;
  lang = code;
  store.set(K_LANG, code);
  document.documentElement.lang = code;
  rebuildScreens();
  if (loginEl && loginEl.isConnected) { const nu = Login(); loginEl.replaceWith(nu); loginEl = nu; }
  updateCartBadges();
}
function rebuildScreens() {   // rebuild the open screens, keeping each one's scroll position
  stack.forEach((s, i) => {
    const old = s.el, sc = old.querySelector('.scroller'), top = sc ? sc.scrollTop : 0;
    const nu = SCREENS[s.name](s.params || {});
    old.replaceWith(nu); s.el = nu;
    const nsc = nu.querySelector('.scroller'); if (nsc) nsc.scrollTop = top;
    if (i < stack.length - 1) { nu.style.visibility = 'hidden'; nu.setAttribute('inert', ''); }
  });
}

/* ================= live updates from the admin panel =================
   The storage event fires when another tab or window (admin.html) saves settings, stock or orders. */
let syncPending = false;
function syncFromAdmin() {
  const before = new Map(waitingLines().map(l => [l.key, l]));
  loadShared();
  wish = wish.filter(x => BR[x.bid]);
  const nCart = cart.length;
  cart = cart.filter(it => BR[it.bid] && !BR[it.bid].off && BR[it.bid].amounts.includes(it.amount));
  if (cart.length !== nCart) store.set(K_CART, cart);
  // tell the customer when one of their pre-orders was delivered from the admin panel
  let arrived = 0;
  orderLines(['delivered']).forEach(l => { if (before.has(l.key)) arrived++; });
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && app.contains(ae)) {   // don't wipe what the person is typing
    if (!syncPending) { syncPending = true; ae.addEventListener('blur', () => { syncPending = false; rebuildScreens(); updateCartBadges(); }, { once: true }); }
  } else { rebuildScreens(); updateCartBadges(); }
  if (arrived) toast(t('arrived'));
}
window.addEventListener('storage', e => {
  if (e.key === null || e.key === K_MEDIA) loadMedia();
  if (e.key === null || e.key === K_WISH) wish = (store.get(K_WISH, []) || []).filter(x => x && BR[x.bid]);
  if (e.key === null || e.key === K_USED) usedSet = new Set(store.get(K_USED, []) || []);
  if (e.key === null || e.key === K_CART) cart = (store.get(K_CART, []) || []).filter(it => it && BR[it.bid] && FLAG[it.region]);
  if (e.key === null || [K_CONFIG, K_STOCK, K_ORDERS, K_MEDIA, K_WISH, K_USED, K_CART, K_API].includes(e.key)) syncFromAdmin();
  if (e.key === null || e.key === K_TICKETS) {
    const before = unreadCount();
    loadTickets(); emit();
    if (unreadCount() > before) toast(t('newReply'));
  }
});

/* ================= login with M-Pesa ================= */
let loginEl = null;
function Login() {
  const art = [['netflix', 27, 46, 46], ['playstation', 74, 32, 40], ['spotify', 62, 78, 44], ['apple', 12, 86, 30]];
  const el = h(`<div class="screen login">
    <button class="lang-pill" data-act="lang" aria-label="${esc(t('chooseLanguage'))}">${ic('globe')}${esc(langInfo(lang).native)}</button>
    <div class="lg-art" aria-hidden="true">
      <div class="dots"></div>
      ${art.map(([id, x, y, w], i) => `<div class="fl" style="left:${x}%;top:${y}%;width:${w}%;--i:${i};--d:${i * -0.9}s">${pkg(id, [100, 50, 200, 150][i % 4], 'ETH')}</div>`).join('')}
    </div>
    <div class="lg-body">
      ${ecBadge()}
      <h1 class="lg-h">${esc(t('lgTitle'))}</h1>
      <p class="lg-p">${esc(t('lgSub'))}</p>
      <button class="btn lg-btn" data-login>${ic('wallet')}${esc(t('loginBtn'))}</button>
      <p class="lg-fine">${esc(t('lgFine'))}</p>
    </div>
  </div>`);
  el.querySelector('[data-login]').addEventListener('click', openConsent);
  return el;
}
function openConsent() {
  const w = openSheet(`<div class="grab"></div>
    <div class="consent" data-state="ask">
      <div class="st st-ask">
        <div class="cs-head">
          <span class="cs-app">${ecBadge()}eCards</span>
          <span class="cs-swap">${ic('swap')}</span>
          <span class="cs-app"><span class="cs-mp">${ic('wallet')}</span>M-Pesa</span>
        </div>
        <h3>${esc(t('consentTitle'))}</h3>
        <div class="cs-acct"><span class="avatar">${esc(initials(DEMO_USER.name))}</span><span class="who"><b>${esc(DEMO_USER.name)}</b><small>${esc(DEMO_USER.phone)}</small></span><span class="cs-tag">${esc(t('demo'))}</span></div>
        <p class="cs-lead">${esc(t('willSee'))}</p>
        <ul class="cs-list"><li>${ic('check')}${esc(t('yourName'))}</li><li>${ic('check')}${esc(t('yourPhone'))}</li></ul>
        <p class="note">${esc(t('consentNote'))}</p>
        <div class="sheet-btns"><button class="btn ghost" data-cancel>${esc(t('cancel'))}</button><button class="btn" data-allow>${esc(t('allow'))}</button></div>
      </div>
      <div class="st st-wait"><div class="spin"></div><h3>${esc(t('loggingIn'))}</h3></div>
    </div>`, { label: t('loginBtn') });
  const cs = w.querySelector('.consent');
  w.querySelector('[data-cancel]').addEventListener('click', () => { closeSheet(); toast(t('needLogin')); });
  w.querySelector('[data-allow]').addEventListener('click', () => {
    cs.dataset.state = 'wait'; w.dataset.lock = '1';
    setTimeout(() => {
      session = { name: DEMO_USER.name, phone: DEMO_USER.phone, at: Date.now() };
      store.set(K_SESSION, session);
      loadShared();
      delete w.dataset.lock;
      closeSheet(true);
      enterHome(loginEl);
    }, 1300);
  });
}
function fadeOut(el) {
  if (!el || !el.isConnected) return;
  if (reduce || !el.animate) { el.remove(); return; }
  el.style.pointerEvents = 'none';
  el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: 'ease', fill: 'forwards' }).onfinish = () => el.remove();
}
function showLogin(fromEl) {
  const lg = Login(); loginEl = lg;
  if (fromEl && fromEl.isConnected) app.insertBefore(lg, fromEl); else app.appendChild(lg);
  fadeOut(fromEl);
}
function enterHome(fromEl) {
  const home = Home();
  if (fromEl && fromEl.isConnected) app.insertBefore(home, fromEl); else app.appendChild(home);
  stack.length = 0; stack.push({ name: 'home', params: {}, el: home });
  updateCartBadges();
  fadeOut(fromEl);
  loginEl = null;
  if (!store.get(K_WELCOME, false)) setTimeout(openWelcome, reduce ? 60 : 700);
  else if (session) toast(t('loggedInAs', { name: session.name }));
}
function logout(msgKey) {
  closeSheet(true);
  session = null; store.set(K_SESSION, null);
  const old = stack.splice(0);
  const lg = Login(); loginEl = lg;
  app.appendChild(lg);
  const clear = () => old.forEach(s => s.el.remove());
  if (reduce || !lg.animate) clear();
  else lg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: 'ease' }).onfinish = clear;
  toast(t(msgKey || 'loggedOut'));
}
function resetDemo() {   // this customer's orders, cart and wishlist back to the start; the admin's brands, prices and stock stay
  loadShared();
  allOrders = allOrders.filter(o => !mine(o)); saveOrders();
  cart = []; usedSet.clear(); saveUsed();
  wish = []; saveWish();
  mutateTickets(list => { for (let i = list.length - 1; i >= 0; i--) if (mineT(list[i])) list.splice(i, 1); });
  store.set(K_CART, cart);
  store.set(K_WELCOME, false);
  emit();
  logout('demoReset');
}

/* ================= first-time welcome ================= */
function openWelcome() {
  const w = openSheet(`<div class="wl">
      <div class="wl-top">
        <div class="wl-langs" role="group" aria-label="${esc(t('language'))}">${LANGS.map(l => `<button data-wlang="${l.code}" lang="${l.code}">${esc(l.native)}</button>`).join('')}</div>
        <button class="wl-x" data-close>${ic('close')}</button>
      </div>
      ${ecBadge()}
      <h2 class="wl-title"></h2>
      <p class="wl-intro"></p>
      <h3 class="wl-how"></h3>
      <ol class="wl-steps">${[0, 1, 2, 3].map(i => `<li><span class="n">${i + 1}</span><div><b></b><span class="d"></span></div></li>`).join('')}</ol>
      <p class="wl-note">${ic('info')}<span></span></p>
      <button class="btn wl-cta" data-close></button>
    </div>`, { modal: true, label: 'eCards', onClose: () => store.set(K_WELCOME, true) });
  const root = w.querySelector('.wl');
  function render() {
    root.setAttribute('lang', lang);
    root.querySelector('.wl-title').textContent = t('w_title');
    root.querySelector('.wl-intro').textContent = t('w_intro');
    root.querySelector('.wl-how').textContent = t('w_how');
    const steps = t('w_steps');
    root.querySelectorAll('.wl-steps li').forEach((li, i) => { li.querySelector('b').textContent = steps[i][0]; li.querySelector('.d').textContent = steps[i][1]; });
    root.querySelector('.wl-note span').textContent = t('w_note');
    root.querySelector('.wl-cta').textContent = t('w_cta');
    root.querySelector('.wl-x').setAttribute('aria-label', t('close'));
    root.querySelectorAll('[data-wlang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.wlang === lang)));
    const box = root.querySelector('.wl-langs'), on = box.querySelector('[aria-pressed="true"]');
    if (on) box.scrollLeft = Math.max(0, on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2);
  }
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-wlang]');
    if (b) { applyLang(b.dataset.wlang); render(); }
  });
  render();
}

/* ================= global taps ================= */
app.addEventListener('click', e => {
  const sl = e.target.closest('[data-setlang]');
  if (sl) { closeSheet(); applyLang(sl.dataset.setlang); return; }
  const o = e.target.closest('[data-open]');
  if (o) {
    const [bid, v, r] = o.dataset.open.split('|');
    closeSheet(true);
    push('product', { bid, val: v ? +v : null, reg: r || null });
    return;
  }
  const a = e.target.closest('[data-act]'); if (!a) return;
  switch (a.dataset.act) {
    case 'back': goBack(); break;
    case 'exit': toast(t('exitToast')); break;
    case 'orders': push('orders'); break;
    case 'search': push('search'); break;
    case 'all': push('brands'); break;
    case 'cart': closeSheet(true); push('cart'); break;
    case 'home': resetHome(); break;
    case 'myorders': resetHome(); push('orders'); break;
    case 'howto': openWelcome(); break;
    case 'logout': logout(); break;
    case 'reset': resetDemo(); break;
    case 'lang': openLangSheet(); break;
    case 'settings': push('settings'); break;
    case 'support': push('support'); break;
    case 'new-ticket': openTicketForm(); break;
    case 'delivery': openRecvSheet(); break;
    case 'wishlist': push('wishlist'); break;
  }
});

/* ================= boot ================= */
app.classList.add('booting');
probeAssets().then(() => {
  loadMedia();
  app.classList.remove('booting');
  const splash = Splash();
  app.appendChild(splash);
  let booted = false;
  function boot() {
    if (booted) return; booted = true;
    if (session) enterHome(splash); else showLogin(splash);
  }
  setTimeout(boot, 2600);
  splash.addEventListener('click', boot);
});
})();
</script>
